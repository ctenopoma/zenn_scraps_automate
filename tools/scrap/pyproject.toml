[project]
name = "zenn-scrap"
version = "0.1.0"
description = "scraps/<topic>/ の Markdown を Zenn のスクラップとして投稿・照合する CLI(Public API 開放までの場つなぎ)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.63.0",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
zenn-scrap = "zenn_scrap.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
